[package]
name = "diskgoblin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "diskgoblin"
path = "src/main.rs"

[[bin]]
name = "factory_eval"
path = "src/bin/factory_eval.rs"

[dependencies]
diskgoblin-core.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
diskgoblin-core = { path = "../diskgoblin-core", features = ["test-utils"] }

[lints]
workspace = true
