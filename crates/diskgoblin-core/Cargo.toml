[package]
name = "diskgoblin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Benchmarks live in `benches/scanner_bench.rs`; the libtest harness must not
# run unit tests as benchmarks, or it rejects Criterion flags such as `--quick`.
bench = false

[features]
test-utils = ["dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
diskgoblin-core = { path = ".", features = ["test-utils"] }
tempfile = "3"

[[bench]]
name = "scanner_bench"
harness = false

[lints]
workspace = true
